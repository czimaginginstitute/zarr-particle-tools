name: Run Pytest - All Tests
permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Zenodo record hosting the test data tarballs. Bump this when publishing a new version.
  ZENODO_RECORD: "21797999"

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Maximize build space (#1)
        uses: mathio/gha-cleanup@aca3d43a05bf564f5fc69acb929a65b01797f22b
        with:
          remove-browsers: true
          verbose: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync --locked --extra dev

      - name: Download test data from Zenodo
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p tests/data
          cd tests/data

          # Download both files with retries and resume
          curl -L --fail --retry 5 --retry-delay 5 --continue-at - \
            -o zarr_particle_tools_test_data_large.tar.gz \
            "https://zenodo.org/records/${{ env.ZENODO_RECORD }}/files/zarr_particle_tools_test_data_large.tar.gz?download=1"

          curl -L --fail --retry 5 --retry-delay 5 --continue-at - \
            -o zarr_particle_tools_test_data_small.tar.gz \
            "https://zenodo.org/records/${{ env.ZENODO_RECORD }}/files/zarr_particle_tools_test_data_small.tar.gz?download=1"


      - name: Extract test data from tar.gz files
        run: |
          # Extract
          cd tests/data
          for f in *.tar.gz; do tar -xzf "$f"; done

      - name: List contents
        run: ls -lah tests/data

      - name: Run tests
        run: |
          uv run --locked pytest -n 1 -vvv
