name: Run Pytest
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Zenodo record hosting the test data tarballs. Bump this when publishing a new version; it also
  # keys the cache, so a stale cache is not reused across record versions.
  ZENODO_RECORD: "21797999"

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - python-version: "3.10"
            cache: true

    steps:
      # - name: Maximize build space (#1)
      #   uses: mathio/gha-cleanup@aca3d43a05bf564f5fc69acb929a65b01797f22b
      #   with:
      #     remove-browsers: true
      #     verbose: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync --locked --extra dev

      - name: Restore test data from cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: tests/data
          key: zenodo-${{ env.ZENODO_RECORD }}-small

      - name: Download test data from Zenodo (cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p tests/data
          cd tests/data

          # Download both files with retries and resume
          # curl -L --fail --retry 5 --retry-delay 5 --continue-at - \
          #   -o zarr_particle_tools_test_data_large.tar.gz \
          #   "https://zenodo.org/records/${{ env.ZENODO_RECORD }}/files/zarr_particle_tools_test_data_large.tar.gz?download=1"

          curl -L --fail --retry 5 --retry-delay 5 --continue-at - \
            -o zarr_particle_tools_test_data_small.tar.gz \
            "https://zenodo.org/records/${{ env.ZENODO_RECORD }}/files/zarr_particle_tools_test_data_small.tar.gz?download=1"

      - name: Save test data to cache
        if:  ${{ matrix.cache && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: tests/data
          key: zenodo-${{ env.ZENODO_RECORD }}-small

      - name: Extract test data from tar.gz files
        run: |
          # Extract
          cd tests/data
          for f in *.tar.gz; do tar -xzf "$f"; done

      - name: List contents
        run: ls -lah tests/data

      - name: Run tests
        run: |
          uv run --locked pytest -n 1 -vvv -k "not (local and unroofing)"
