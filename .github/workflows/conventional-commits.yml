# Validates PR title follows conventional commits
name: conventional-commits
permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    types:
      - edited
      - opened
      - synchronize
      - reopened

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  conventional_commit_title:
    runs-on: ubuntu-latest
    steps:
      - uses: chanzuckerberg/github-actions/.github/actions/conventional-commits@a46295293bf13912f127b36d00eb2516fa18d5ea
